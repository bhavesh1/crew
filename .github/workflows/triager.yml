name: agent-triager

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: triager-${{ github.event.issue.number }}

jobs:
  triage:
    if: ${{ !contains(github.event.issue.labels.*.name, 'decision-log') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the triager agent. Follow prompts/triager.md exactly.
            Repository: ${{ github.repository }}. Issue number: ${{ github.event.issue.number }}.
          claude_args: >-
            --max-turns 12
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"

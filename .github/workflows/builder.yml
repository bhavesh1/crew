name: agent-builder

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: builder-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ready') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'changes-requested'
        && contains(github.event.pull_request.labels.*.name, 'agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the builder agent. Follow prompts/builder.md exactly.
            Repository: ${{ github.repository }}.
            Event: ${{ github.event_name }}.
            Issue number (new work): ${{ github.event.issue.number }}.
            PR number (revision): ${{ github.event.pull_request.number }}.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(python -m pytest:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr diff:*)"

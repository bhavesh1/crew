name: agent-evals

on:
  schedule:
    - cron: "30 13 * * 0"  # Sundays 19:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DECISION_LOG_ISSUE: ${{ vars.DECISION_LOG_ISSUE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the evals agent. Follow prompts/evals.md exactly.
            Repository: ${{ github.repository }}. Decision log issue: #${{ vars.DECISION_LOG_ISSUE }}.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(date:*),Bash(python3:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr create:*)"

name: agent-release-docs

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 09:30 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the release & docs agent. Follow prompts/release.md exactly.
            Repository: ${{ github.repository }}.
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(date:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*)"
